<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d2733">
<title>Разминка для головы</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#1b2430;--muted:#6b7686;--line:#d9dee5;--accent:#1f6feb;--danger:#d93a3a;--ok:#1a8a4a;--bar:#1d2733;--barInk:#e9eef5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:default}
.hidden{display:none!important}
svg.i{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header.top{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--barInk);display:flex;align-items:center;gap:4px;padding:6px 8px;min-height:58px;padding-top:calc(6px + env(safe-area-inset-top))}
header.top h1{font-size:19px;margin:0 6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ibtn{min-width:48px;height:48px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.ibtn:active{background:rgba(255,255,255,.15)}
main{max-width:720px;margin:0 auto;padding:12px 12px 90px}
h2{font-size:21px;margin:6px 4px 12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.big{width:100%;min-height:58px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;margin-bottom:10px}
.big.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.big.off{background:#c9d1dc;color:#4b5563}
.big:active:not(:disabled){filter:brightness(.92)}
/* разделы */
.sec{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;min-height:72px}
.sec:active{background:#e8edf4}
.sec .dot{width:14px;align-self:stretch;border-radius:7px;flex:none}
.sec .nm{font-weight:600;font-size:18px}
.sec .ds{font-size:14px;color:var(--muted)}
.sec .go{margin-left:auto;color:var(--muted)}
.exl{width:100%;text-align:left;display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;min-height:64px}
.exl:active{background:#e8edf4}
.exl .nm{font-weight:600;font-size:18px}
.soon{display:flex;justify-content:space-between;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;margin-bottom:8px;color:var(--muted)}
/* выбор режима и уровня */
.seg{display:flex;background:#e3e8ef;border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;min-height:52px;border-radius:11px;font-weight:600;color:#3b4656}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.lvl{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);text-align:left;padding:8px 14px}
.lvl.on{border-color:var(--accent);background:#eaf2ff}
.lvl b{display:block}
.lvl span{font-size:14px;color:var(--muted)}
.lbl{font-size:14px;color:var(--muted);margin:4px 4px 6px}
/* кнопка «Начать» всегда видна внизу экрана */
.startbar{position:sticky;bottom:0;z-index:3;margin:0 -12px;padding:14px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(242,244,247,0),var(--bg) 35%)}
.startbar .big{margin:0}
/* переключатели эффектов */
.tgl{width:100%;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:left;margin-bottom:8px}
.tgl .sw{margin-left:auto;flex:none;width:52px;height:30px;border-radius:15px;background:#c9d1dc;position:relative}
.tgl .sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff}
.tgl.on .sw{background:var(--accent)}
.tgl.on .sw::after{left:25px}
.tgl small,.opt small{display:block;color:var(--muted);font-size:13px}
.card.opt{padding:10px 14px;margin-bottom:8px}
.card.opt .seg button{min-height:46px}
/* выполнение упражнения */
.strip{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:18px;min-height:52px}
.strip .tm{font-variant-numeric:tabular-nums;font-weight:600}
.exroot{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:300px;height:calc(100vh - 290px);height:calc(100dvh - 290px);overflow:hidden;margin-bottom:10px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
/* экран игры занимает всю высоту под шапкой: поле получает максимум места */
main.run{display:flex;flex-direction:column;padding:6px 6px calc(6px + env(safe-area-inset-bottom));height:calc(100vh - 58px - env(safe-area-inset-top));height:calc(100dvh - 58px - env(safe-area-inset-top))}
main.run .strip{min-height:44px;padding:6px 12px;margin-bottom:6px;font-size:17px;flex:none}
main.run .exroot{flex:1;height:auto;min-height:0;margin-bottom:6px}
main.run #exStop{min-height:48px;margin:0;flex:none}
/* таблица Шульте */
.exroot.center{display:flex;align-items:center;justify-content:center}
.sch{display:grid;gap:4px}
.sch-c{background:#eef2f7;border-radius:8px;font-weight:600;color:var(--ink);font-size:inherit;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.sch-c.press{background:#bcd3f7}
.sch-c.bad{background:#f6c9c9}
/* время реакции */
.rt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:24px;font-weight:600;color:#fff;touch-action:manipulation}
.rt b{font-size:52px}
.rt.wait{background:#5b6675}.rt.go{background:#1a8a4a}.rt.red{background:#d93a3a}.rt.bad{background:#b8620b}.rt.shown{background:#1f6feb}
/* пары */
.pr{display:grid;gap:6px}
.pr-c{border-radius:10px;background:#3b5b8a;display:flex;align-items:center;justify-content:center;line-height:1;touch-action:manipulation;font-size:inherit}
.pr-c.up{background:#fff;border:2px solid var(--line)}
.pr-c.done{background:#eef7f1;border-color:#cfe7d7}
.pr-c.press{background:#bcd3f7}
.pr-c.match{background:#bfe8cc}
.pr-c.flip{animation:prflip .18s ease-out}
@keyframes prflip{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* счёт в уме */
.ct{position:absolute;inset:0;display:flex;flex-direction:column}
.ct-top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;min-height:120px}
.ct-q{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;padding:6px 14px;border-radius:12px;text-align:center}
.ct-q.okf{background:#bfe8cc}.ct-q.badf{background:#f6c9c9}
.ct-m{min-height:24px;margin-top:6px;font-size:17px;color:var(--muted)}
.ct-m.err{color:var(--danger);font-weight:600}
.ct-k{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}
.ct-k button{min-height:58px;border-radius:12px;background:#eef2f7;font-size:26px;font-weight:600;touch-action:manipulation}
.ct-k button.fn{font-size:17px;color:#3b4656}
.ct-k button.press{background:#bcd3f7}
@media(max-height:700px){.ct-k button{min-height:48px}.ct-q{font-size:32px}}
/* судоку */
.sd{position:absolute;inset:0;display:flex;flex-direction:column}
.sd-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:2px;min-height:0}
.sd-g{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);border:2px solid #34405a;background:#fff}
.sd-c{border-right:1px solid #c9d0db;border-bottom:1px solid #c9d0db;font-size:inherit;font-weight:400;color:#2559c9;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation;min-width:0;min-height:0;line-height:1}
.sd-c.c2,.sd-c.c5{border-right:2px solid #34405a}.sd-c.c8{border-right:0}
.sd-c.r2,.sd-c.r5{border-bottom:2px solid #34405a}.sd-c.r8{border-bottom:0}
.sd-c.giv{color:#1b2430}
.sd-c.area{background:#e8eef7}.sd-c.same{background:#cfdcf0}.sd-c.sel{background:#b3cdf5}
.sd-c.wrong{color:var(--danger)}
.nt{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;font-size:.4em;line-height:1;color:#3b4656;font-weight:500}
.nt i{font-style:normal;display:flex;align-items:center;justify-content:center}
.sd-pad{flex:none;padding:4px 2px 2px}
.sd-dg{display:grid;grid-template-columns:repeat(9,1fr);gap:2px}
.sd-dg button{min-height:60px;border-radius:10px;font-size:34px;font-weight:400;color:#2559c9;touch-action:manipulation}
.sd-dg button.used{color:#b8c2d1}
.sd-tl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.sd-tl button{min-height:46px;border-radius:12px;background:#eef2f7;font-size:17px;font-weight:600;color:#3b4656;touch-action:manipulation}
.sd-tl .on{background:var(--accent);color:#fff}
.sd-pad button.press{background:#bcd3f7}
/* пятнашки */
.pz{position:relative;background:#e3e8ef;border-radius:12px}
.pz-t{position:absolute;left:2px;top:2px;border-radius:10px;background:#3b5b8a;color:#fff;font-weight:700;font-size:inherit;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.pz-t.press{background:#5d82bd}
/* дыхание */
.br{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px}
.br-mid{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:200px}
.br-c{position:absolute;width:min(80%,300px);aspect-ratio:1;border-radius:50%;background:#d6ecdc;transform:scale(.45);transition:transform .1s linear}
.br-t{position:relative;text-align:center}
.br-ph{font-size:38px;font-weight:700;color:#1a6b3a}
.br-s{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.br-bar{height:12px;border-radius:6px;background:#e3e8ef;overflow:hidden;margin:10px 0}
.br-bar i{display:block;height:100%;width:0;background:#3a9a52}
.br .big{margin:0}
/* итог */
.res{text-align:center;padding:22px 14px}
.res .sc{font-size:46px;font-weight:700;color:var(--accent)}
.res .un{color:var(--muted)}
.res .rec{color:var(--ok);font-weight:600;margin-top:8px}
/* статистика */
table.st{width:100%;border-collapse:collapse;font-size:15px}
table.st td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
table.st tr:first-child td{border-top:0}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:8px;background:#e3e8ef;color:#3b4656}
.tag.rest{background:#e2f4e8;color:#1a6b3a}
/* окна, меню, уведомления */
#modal{position:fixed;inset:0;z-index:20;background:rgba(15,20,28,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media(min-width:700px){#modal{align-items:center}}
.dlg{background:var(--card);border-radius:16px;width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:16px}
.dlg h3{margin:2px 4px 10px;font-size:19px}
.dlg .dtext{margin:0 4px 12px;color:#3b4656;font-size:15px}
.dbtns{display:grid;gap:8px}
.dbtns button{min-height:54px;border-radius:12px;background:#eef2f7;font-weight:600;text-align:left;padding:8px 16px}
.dbtns button.pri{background:var(--accent);color:#fff;text-align:center}
.dbtns button.dng{color:var(--danger)}
.dbtns button.cnl{background:none;border:1px solid var(--line);text-align:center}
#toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;background:#1b2430;color:#fff;padding:12px 18px;border-radius:12px;max-width:92vw;font-size:15px;text-align:center}
#updBar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bar);color:var(--barInk);display:flex;align-items:center;gap:12px;padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#updBar span{flex:1}
#updBar button{background:var(--accent);color:#fff;border-radius:10px;min-height:48px;padding:0 20px;font-weight:600}
</style>
</head>
<body>
<header class="top">
  <button class="ibtn hidden" id="backBtn" aria-label="Назад"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 id="appTitle">Разминка для головы</h1>
  <button class="ibtn" id="menuBtn" aria-label="Меню"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</header>
<main id="view"></main>
<div id="modal" class="hidden"></div>
<div id="toast" class="hidden"></div>
<div id="updBar" class="hidden"><span>Доступна новая версия</span><button id="updBtn">Обновить</button></div>
<input type="file" id="fileIn" class="hidden">
<script>
'use strict';
/* =====================================================================
   ВЕРСИЯ. При каждом обновлении увеличивать APP_VERSION вместе с VERSION в sw.js
   ===================================================================== */
const APP_VERSION='0.13',APP_DATE='17.11.2026';
const APP_ID='razminka';

/* =====================================================================
   1. УТИЛИТЫ
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
function fmtDate(iso){const d=new Date(iso);if(isNaN(d))return '—';return `${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;}
function fmtTime(ms){if(ms==null)return '—';const s=ms/1000;if(s<60)return s.toFixed(1).replace('.',',')+' с';const m=Math.floor(s/60);return `${m}:${pad2(Math.floor(s%60))} мин`;}
function fmtTimer(ms){const s=Math.floor(ms/1000);return `${pad2(Math.floor(s/60))}:${pad2(s%60)}.${Math.floor(ms%1000/100)}`;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
// короткая подсветка элемента (визуальный эффект игры — вызывается только если он включён)
function fxFlash(el,cls,ms){el.classList.remove(cls);clearTimeout(el['_fx'+cls]);void el.offsetWidth;el.classList.add(cls);el['_fx'+cls]=setTimeout(()=>el.classList.remove(cls),ms);}
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hidden'),ms);}

/* История браузера. Каждый экран — своя запись: главная (d=0) → раздел → выбор уровня → игра.
   Записи добавляются ТОЛЬКО в момент касания при переходе вперёд: Chrome помечает «пропускаемыми»
   записи, после которых страница добавила новую без касания, и «Назад» их перепрыгивает.
   «Назад» телефона, стрелка в шапке и кнопки «Сменить уровень», «К разделам» ходят по этим записям. */
const activeTap=()=>!navigator.userActivation||navigator.userActivation.isActive;
let modalClose=null,ownBack=null;
function selfBack(){return new Promise(res=>{
  const o={done(){if(ownBack!==o)return;ownBack=null;clearTimeout(o.t);res();}};
  o.t=setTimeout(()=>o.done(),700);ownBack=o;history.back();});}
async function histSettled(){while(ownBack)await new Promise(r=>setTimeout(r,20));}

/* окно выбора. Кнопка «Назад» телефона закрывает окно, а не уходит с экрана */
async function choose(title,html,opts){
  if(modalClose)modalClose();
  await histSettled();
  return new Promise(res=>{
    const m=$('#modal');
    m.innerHTML=`<div class="dlg" role="dialog"><h3>${esc(title)}</h3>${html?`<div class="dtext">${html}</div>`:''}<div class="dbtns">${opts.map((o,i)=>`<button data-i="${i}" class="${o.cls||''}">${esc(o.l)}</button>`).join('')}</div></div>`;
    m.classList.remove('hidden');
    if(activeTap())history.pushState(Object.assign({},history.state,{modal:1}),'');
    const close=(v,fromPop)=>{m.classList.add('hidden');m.innerHTML='';m.onclick=null;modalClose=null;
      if(!fromPop&&history.state&&history.state.modal)selfBack();
      res(v);};
    modalClose=fromPop=>close(null,fromPop);
    m.onclick=e=>{if(e.target===m){close(null);return;}const b=e.target.closest('button[data-i]');if(b)close(opts[+b.dataset.i].k);};
  });
}
const confirmAsk=(title,text,yes,cls='pri')=>choose(title,text,[{k:true,l:yes,cls},{k:false,l:'Отмена',cls:'cnl'}]);

/* =====================================================================
   2. ХРАНИЛИЩЕ (локально, в браузере). Структура версионируется: SCHEMA.
   Ключи начинаются с «razminka.» — у других приложений домена свои ключи.
   ===================================================================== */
const Store=(()=>{
  const KEY='razminka.data',BAK='razminka.data.bak';
  const SCHEMA=1;
  // миграции: MIGRATIONS[n] переводит данные из версии n в n+1
  const MIGRATIONS={};
  let data=null,readOnly=false;
  const fresh=()=>({schema:SCHEMA,results:[],settings:{mode:'train',levels:{},effects:{},saved:{},options:{}},meta:{created:new Date().toISOString(),lastExport:null,lastImport:null}});
  function normalize(d){
    const f=fresh();
    d.results=Array.isArray(d.results)?d.results:[];
    d.settings=Object.assign(f.settings,d.settings&&typeof d.settings==='object'?d.settings:{});
    if(!d.settings.levels||typeof d.settings.levels!=='object')d.settings.levels={};
    if(!d.settings.effects||typeof d.settings.effects!=='object')d.settings.effects={};
    if(!d.settings.saved||typeof d.settings.saved!=='object')d.settings.saved={};
    if(!d.settings.options||typeof d.settings.options!=='object')d.settings.options={};
    for(const k in d.settings.effects){const v=d.settings.effects[k];
      if(typeof v==='boolean')d.settings.effects[k]=v?{error:true}:{};          // формат версии 0.4
      else if(!v||typeof v!=='object')d.settings.effects[k]={};}
    d.meta=Object.assign(f.meta,d.meta&&typeof d.meta==='object'?d.meta:{});
    return d;}
  function migrate(d){
    let n=+d.schema||1;
    while(n<SCHEMA){if(!MIGRATIONS[n])throw new Error('нет перехода со схемы '+n);d=MIGRATIONS[n](d);n++;d.schema=n;}
    return d;}
  function load(){
    let raw=null;try{raw=localStorage.getItem(KEY);}catch(e){}
    if(!raw){data=fresh();return;}
    let d;try{d=JSON.parse(raw);}catch(e){
      // повреждённые данные не затираем: сохраняем копию и начинаем заново
      try{localStorage.setItem(BAK,raw);}catch(_){}data=fresh();save();setTimeout(()=>toast('Данные повреждены, копия сохранена. Статистика начата заново',5000),500);return;}
    if((+d.schema||1)>SCHEMA){
      // данные от более новой версии — не трогаем, работаем только на чтение
      readOnly=true;data=normalize(d);setTimeout(()=>toast('Данные созданы более новой версией приложения. Обновите приложение — запись отключена',6000),500);return;}
    if((+d.schema||1)<SCHEMA){try{localStorage.setItem(BAK,raw);}catch(_){}d=migrate(d);}
    data=normalize(d);data.schema=SCHEMA;}
  function save(){
    if(readOnly)return false;
    try{localStorage.setItem(KEY,JSON.stringify(data));return true;}
    catch(e){toast('Не удалось сохранить данные (нет места?)',4000);return false;}}
  return{SCHEMA,migrate,normalize,load,save,get data(){return data;},get readOnly(){return readOnly;},
    setData(d){data=normalize(d);data.schema=SCHEMA;return save();},
    settings(){return data.settings;}};
})();

/* =====================================================================
   3. ЯДРО: разделы и реестр упражнений
   Упражнение — подключаемый модуль. Добавляется вызовом Registry.register({...}):
     id        — уникальный код (латиницей), title — название, section — код раздела
     desc      — краткое описание
     modes     — ['train','rest'] — какие режимы поддерживает
     levels    — [{id:'1',name:'Лёгкий',hint:'…'}, …] — уровни сложности
     score     — {unit:'…', better:'high'|'low'} — что такое очки и что лучше
     effects   — (необязательно) визуальные эффекты игры: [{id:'press',name:'…',hint:'…'}, …];
                 у каждого свой переключатель, по умолчанию выключен; в ctx.effects.<id> — включён ли
     options   — (необязательно) настройки игры: [{id,name,hint,type:'toggle',def:false}] или
                 [{id,name,type:'choice',choices:[{v:3,l:'3'},…],def:3}]; значения — в ctx.options.<id>
     save()    — (необязательно) состояние партии для автосохранения; при «Продолжить» оно приходит в ctx.resume
     levelLabel— (необязательно) подпись вместо «Уровень сложности»
     ownTimer  — (необязательно) true: упражнение само показывает время, общий секундомер скрыт
     start(ctx)— запуск; ctx: root, mode, level, train, setInfo(), startTimer(), elapsed(), finish({score,timeMs,extra})
     stop()    — остановка (убрать таймеры и обработчики)
   ===================================================================== */
const SECTIONS=[
  {id:'attention',name:'Внимание',color:'#e3893b',desc:'Сосредоточенность и скорость поиска',planned:['Таблица Шульте','Найди отличия','Струп-тест']},
  {id:'memory',name:'Память',color:'#8a5cd6',desc:'Удержание и воспроизведение',planned:['Пары (мемори)','Запомни последовательность','N-back']},
  {id:'count',name:'Счёт',color:'#1f9a8a',desc:'Устный счёт и прикидка',planned:['Счёт в уме на время','Прикидка и проценты','2048']},
  {id:'logic',name:'Логика',color:'#1f6feb',desc:'Рассуждение и выводы',planned:['Судоку','Японские кроссворды','Логические задачи с таблицей']},
  {id:'space',name:'Пространственное мышление',color:'#c2477a',desc:'Фигуры, виды, развёртки',planned:['Пятнашки','Вращение фигур','Развёртка куба','Три вида детали','Танграм']},
  {id:'reaction',name:'Реакция',color:'#d93a3a',desc:'Быстрота отклика',planned:['Время реакции','Ловля целей']},
  {id:'rest',name:'Отдых',color:'#3a9a52',desc:'Разгрузка без спешки',planned:['Дыхание по ритму','Спокойные игры без таймера','Фоновые звуки с таймером']},
];
const secById=id=>SECTIONS.find(s=>s.id===id);
const MODES={train:'Тренировка',rest:'Отдых'};

const Registry=(()=>{
  const list=[];
  function register(m){
    const err=[];
    if(!m||typeof m.id!=='string'||!/^[a-z0-9_-]+$/.test(m.id))err.push('id');
    if(list.some(x=>x.id===m.id))err.push('повтор id');
    if(!m.title)err.push('title');
    if(!secById(m.section))err.push('section');
    if(!Array.isArray(m.modes)||!m.modes.length||m.modes.some(x=>!MODES[x]))err.push('modes');
    if(!Array.isArray(m.levels)||!m.levels.length)err.push('levels');
    if(typeof m.start!=='function'||typeof m.stop!=='function')err.push('start/stop');
    if(!m.score)m.score={unit:'очков',better:'high'};
    if(m.effects&&(!Array.isArray(m.effects)||m.effects.some(f=>!f||!f.id||!f.name)))err.push('effects');
    if(err.length){console.error('Упражнение не подключено:',m&&m.id,err.join(', '));return false;}
    m.levels.forEach(l=>l.id=String(l.id));
    list.push(m);return true;}
  return{register,all:()=>list.slice(),get:id=>list.find(x=>x.id===id),bySection:s=>list.filter(x=>x.section===s)};
})();

/* =====================================================================
   4. СТАТИСТИКА. Единый формат результата:
   {id, ex, section, mode, date, level, score, timeMs, extra}
   В режиме «Отдых» score и timeMs = null — записывается только факт занятия.
   ===================================================================== */
const Stats=(()=>{
  function make(mod,mode,level,r){
    const rest=mode==='rest';
    return{id:uid(),ex:mod.id,section:mod.section,mode,date:new Date().toISOString(),level:String(level.id),
      score:rest||r.score==null?null:Math.round(r.score*100)/100,
      timeMs:rest||r.timeMs==null?null:Math.round(r.timeMs),
      extra:r.extra&&typeof r.extra==='object'?r.extra:null};}
  // проверка одной записи (для импорта и на всякий случай)
  function valid(r){
    return r&&typeof r==='object'&&typeof r.id==='string'&&typeof r.ex==='string'&&typeof r.section==='string'
      &&MODES[r.mode]&&typeof r.date==='string'&&!isNaN(new Date(r.date))
      &&(r.score===null||typeof r.score==='number'&&isFinite(r.score))
      &&(r.timeMs===null||typeof r.timeMs==='number'&&isFinite(r.timeMs))
      &&r.level!=null;}
  function add(rec){Store.data.results.push(rec);return Store.save();}
  const all=()=>Store.data.results;
  function best(exId,levelId,excludeId){
    const mod=Registry.get(exId);const low=mod&&mod.score.better==='low';
    let b=null;for(const r of all()){if(r.ex!==exId||r.mode!=='train'||r.level!==String(levelId)||r.score==null||r.id===excludeId)continue;
      if(b==null||(low?r.score<b.score:r.score>b.score))b=r;}
    return b;}
  function sectionSummary(secId){
    const rs=all().filter(r=>r.section===secId);
    let last=null;for(const r of rs)if(!last||r.date>last)last=r.date;
    return{count:rs.length,train:rs.filter(r=>r.mode==='train').length,rest:rs.filter(r=>r.mode==='rest').length,last};}
  const recent=n=>all().slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,n);
  return{make,valid,add,all,best,sectionSummary,recent};
})();

/* =====================================================================
   5. УПРАЖНЕНИЯ
   ===================================================================== */

/* --- Таблица Шульте (Внимание). Найти числа по порядку от 1 до N.
       Очки = время в секундах (меньше — лучше), ошибки записываются отдельно. --- */
Registry.register((()=>{
  let c=null,root=null,grid=null,size=0,next=1,errs=0,onRes=null;
  function layout(){
    if(!grid)return;
    const side=Math.max(160,Math.min(root.clientWidth,root.clientHeight)-16);
    grid.style.width=grid.style.height=side+'px';
    grid.style.fontSize=Math.round(side/size*0.42)+'px';}
  function info(){c.setInfo(`Найдите: ${next}`+(c.train&&errs?` · ошибок: ${errs}`:''));}
  function down(e){
    const cell=e.target.closest('.sch-c');if(!cell||!c)return;
    e.preventDefault();
    const right=+cell.dataset.n===next;
    if(c.effects.error&&!right){cell.classList.remove('press');fxFlash(cell,'bad',250);}
    else if(c.effects.press){cell.classList.remove('bad');fxFlash(cell,'press',150);}
    if(right){
      next++;
      if(next>size*size){const t=c.elapsed();c.finish({score:t/1000,timeMs:t,extra:{errors:errs,size}});return;}
      info();
    }else{
      errs++;info();}}
  return{
    id:'schulte',title:'Таблица Шульте',section:'attention',
    desc:'Найдите и нажмите числа по порядку: 1, 2, 3… Смотрите в центр таблицы и старайтесь охватить её взглядом целиком.',
    modes:['train','rest'],
    levels:[{id:'1',name:'Лёгкий',hint:'3×3, числа 1–9'},{id:'2',name:'Средний',hint:'4×4, числа 1–16'},{id:'3',name:'Классический',hint:'5×5, числа 1–25'},{id:'4',name:'Сложный',hint:'6×6, числа 1–36'}],
    score:{unit:'с',better:'low'},
    effects:[{id:'press',name:'Подсветка нажатия',hint:'Нажатая клетка на мгновение подсвечивается'},{id:'error',name:'Подсветка ошибки',hint:'Ошибочная клетка на мгновение подсвечивается красным'}],
    summary:r=>r.extra&&r.extra.errors!=null?`Ошибок: <b>${r.extra.errors}</b>`:'',
    start(ctx){
      c=ctx;root=ctx.root;size={1:3,2:4,3:5,4:6}[ctx.level.id]||5;next=1;errs=0;
      const nums=[];for(let i=1;i<=size*size;i++)nums.push(i);
      for(let i=nums.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[nums[i],nums[j]]=[nums[j],nums[i]];}
      root.classList.add('center');
      grid=document.createElement('div');grid.className='sch';grid.style.gridTemplateColumns=`repeat(${size},1fr)`;
      grid.innerHTML=nums.map(n=>`<button class="sch-c" data-n="${n}">${n}</button>`).join('');
      grid.addEventListener('pointerdown',down);
      root.appendChild(grid);layout();
      onRes=()=>layout();addEventListener('resize',onRes);
      info();ctx.startTimer();},
    stop(){if(grid)grid.removeEventListener('pointerdown',down);if(onRes)removeEventListener('resize',onRes);
      if(root)root.classList.remove('center');grid=null;c=null;root=null;onRes=null;}
  };
})());

/* --- Время реакции (Реакция). Нажать, как только поле стало зелёным.
       Очки = среднее время реакции в мс (меньше — лучше).
       Уровень «Выбор»: иногда поле красное — его нажимать нельзя. --- */
Registry.register((()=>{
  let c=null,box=null,timer=0,raf=0,state='',tGo=0,times=[],falses=0,misses=0,total=0,choice=false;
  function set(cls,html){box.className='rt '+cls;box.innerHTML=html;}
  function info(){c.setInfo(`Попытка ${Math.min(times.length+1,total)} из ${total}`);}
  function later(fn,ms){clearTimeout(timer);timer=setTimeout(()=>{if(c)fn();},ms);}
  function next(){
    if(times.length>=total){finish();return;}
    info();state='wait';set('wait','Ждите зелёный…');
    later(()=>{
      if(choice&&Math.random()<0.3){
        state='red';set('red','Красный — не нажимайте!');
        later(()=>{state='pause';set('wait','Верно, удержались');later(next,900);},1300);
      }else{
        set('go','Жмите!');
        // отсчёт — с момента, когда зелёный реально выводится на экран
        raf=requestAnimationFrame(()=>{if(!c)return;state='go';tGo=performance.now();});
      }
    },1200+Math.random()*2800);}
  function down(e){
    if(!c)return;e.preventDefault();
    const now=performance.now();
    if(state==='wait'){falses++;state='pause';set('bad','Рано! Дождитесь зелёного');later(next,1300);}
    else if(state==='go'){const ms=Math.max(0,now-tGo);times.push(ms);state='pause';
      set('shown',c.train?`<b>${Math.round(ms)}</b> мс`:'Есть!');later(next,1000);}
    else if(state==='red'){misses++;state='pause';set('bad','Это был красный');later(next,1300);}}
  function finish(){
    const avg=times.reduce((a,b)=>a+b,0)/times.length;
    c.finish({score:Math.round(avg),extra:{attempts:times.map(Math.round),best:Math.round(Math.min(...times)),falseStarts:falses,errors:misses}});}
  return{
    id:'reaction',title:'Время реакции',section:'reaction',
    desc:'Поле серое — ждите. Как только станет зелёным, нажмите на него как можно быстрее. Нажатие раньше времени — фальстарт.',
    modes:['train','rest'],
    levels:[{id:'1',name:'Лёгкий',hint:'3 попытки'},{id:'2',name:'Средний',hint:'5 попыток'},{id:'3',name:'Выбор',hint:'5 попыток, на красный не нажимать'}],
    score:{unit:'мс, среднее',short:'мс',better:'low'},
    summary:r=>r.extra?[`Лучшая попытка: <b>${r.extra.best} мс</b>`,`Фальстартов: <b>${r.extra.falseStarts}</b>`,r.level==='3'?`Нажатий на красный: <b>${r.extra.errors}</b>`:''].filter(Boolean).join('<br>'):'',
    start(ctx){
      c=ctx;times=[];falses=0;misses=0;total=ctx.level.id==='1'?3:5;choice=ctx.level.id==='3';
      box=document.createElement('div');box.id='rtBox';
      box.addEventListener('pointerdown',down);
      ctx.root.appendChild(box);ctx.startTimer();next();},
    stop(){clearTimeout(timer);cancelAnimationFrame(raf);if(box)box.removeEventListener('pointerdown',down);box=null;c=null;state='';}
  };
})());

/* --- Пары / мемори (Память). Открывать по две карточки и находить одинаковые.
       Очки = число ходов (меньше — лучше), время записывается отдельно. --- */
Registry.register((()=>{
  const SYM=['🍎','🍌','🍇','🍓','🍒','🍋','🥝','🍉','🍑','🍍','🥕','🌽','🍄','🌻','🌵','🐟','🐢','🦋','🐞','🐝'];
  const LV={1:[3,4],2:[4,4],3:[4,5],4:[5,6]}; // столбцов, строк
  let c=null,root=null,grid=null,cols=0,rows=0,open=[],moves=0,found=0,pairs=0,tm=0,onRes=null;
  function layout(){
    if(!grid)return;const g=6,W=root.clientWidth-16,H=root.clientHeight-16;
    const s=Math.max(40,Math.floor(Math.min((W-(cols-1)*g)/cols,(H-(rows-1)*g)/rows)));
    grid.style.gridTemplateColumns=`repeat(${cols},${s}px)`;grid.style.gridAutoRows=s+'px';grid.style.fontSize=Math.round(s*0.55)+'px';}
  function info(){c.setInfo(c.train?`Ходов: ${moves} · пар: ${found} из ${pairs}`:`Пар: ${found} из ${pairs}`);}
  function up(card){card.classList.add('up');card.textContent=card.dataset.v;
    if(c.effects.flip){card.classList.remove('flip');void card.offsetWidth;card.classList.add('flip');}}
  function hide(card){card.classList.remove('up','flip');card.textContent='';}
  function closeOpen(){clearTimeout(tm);tm=0;open.forEach(hide);open=[];}
  function down(e){
    const card=e.target.closest('.pr-c');if(!card||!c)return;e.preventDefault();
    if(card.classList.contains('done')||card.classList.contains('up'))return;
    if(open.length===2)closeOpen();   // неудачную пару не ждём: следующее касание сразу её закрывает
    if(c.effects.press)fxFlash(card,'press',150);
    up(card);open.push(card);
    if(open.length<2)return;
    moves++;const[a,b]=open;
    if(a.dataset.v===b.dataset.v){
      a.classList.add('done');b.classList.add('done');open=[];found++;
      if(c.effects.match){fxFlash(a,'match',400);fxFlash(b,'match',400);}
      info();
      if(found===pairs)c.finish({score:moves,extra:{pairs,moves}});
    }else{info();tm=setTimeout(closeOpen,900);}}
  return{
    id:'pairs',title:'Пары (мемори)',section:'memory',
    desc:'Открывайте по две карточки. Одинаковые остаются открытыми, разные закрываются. Найдите все пары за наименьшее число ходов.',
    modes:['train','rest'],
    levels:[{id:'1',name:'Лёгкий',hint:'12 карточек, 6 пар'},{id:'2',name:'Средний',hint:'16 карточек, 8 пар'},{id:'3',name:'Сложный',hint:'20 карточек, 10 пар'},{id:'4',name:'Эксперт',hint:'30 карточек, 15 пар'}],
    score:{unit:'ходов',short:'ход.',better:'low'},
    effects:[{id:'press',name:'Подсветка нажатия',hint:'Нажатая карточка на мгновение подсвечивается'},
             {id:'match',name:'Подсветка найденной пары',hint:'Найденная пара на мгновение подсвечивается зелёным'},
             {id:'flip',name:'Переворот карточки',hint:'Карточка открывается коротким поворотом'}],
    summary:r=>r.extra?`Пар: <b>${r.extra.pairs}</b> · минимум ходов: ${r.extra.pairs}`:'',
    start(ctx){
      c=ctx;root=ctx.root;[cols,rows]=LV[ctx.level.id]||LV[1];pairs=cols*rows/2;open=[];moves=0;found=0;
      const pool=SYM.slice();for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
      const deck=pool.slice(0,pairs).flatMap(v=>[v,v]);
      for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
      root.classList.add('center');
      grid=document.createElement('div');grid.className='pr';
      grid.innerHTML=deck.map(v=>`<button class="pr-c" data-v="${v}" aria-label="Карточка"></button>`).join('');
      grid.addEventListener('pointerdown',down);root.appendChild(grid);layout();
      onRes=()=>layout();addEventListener('resize',onRes);
      info();ctx.startTimer();},
    stop(){clearTimeout(tm);if(grid)grid.removeEventListener('pointerdown',down);if(onRes)removeEventListener('resize',onRes);
      if(root)root.classList.remove('center');grid=null;c=null;root=null;onRes=null;open=[];}
  };
})());

/* --- Счёт в уме на время (Счёт). Тренировка: сколько примеров решено верно за 60 секунд.
       Отдых: 10 примеров без таймера. Ответ набирается на экранных кнопках (на ПК — и с клавиатуры),
       проверяется сам, как только набрано нужное число цифр. --- */
Registry.register((()=>{
  const DUR=60000,REST_N=10;
  let c=null,root=null,box=null,q=null,prevT='',inp='',right=0,wrong=0,total=0,tick=0,lockUntil=0,msgT=0,ended=false;
  const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  function gen(lv){
    let a,b,op;
    if(lv==='1'){op=Math.random()<.5?'+':'−';if(op==='+'){a=rnd(1,10);b=rnd(1,10);}else{a=rnd(3,20);b=rnd(1,a-1);}}
    else if(lv==='2'){op=Math.random()<.5?'+':'−';if(op==='+'){a=rnd(11,88);b=rnd(2,99-a);}else{a=rnd(20,99);b=rnd(2,a-2);}}
    else if(lv==='3'){if(Math.random()<.5){op='×';a=rnd(2,9);b=rnd(2,9);}else{op='÷';b=rnd(2,9);a=b*rnd(2,9);}}
    else{const k=rnd(0,3);
      if(k===0){op='+';a=rnd(101,889);b=rnd(11,999-a);}
      else if(k===1){op='−';a=rnd(120,999);b=rnd(11,a-10);}
      else if(k===2){op='×';a=rnd(11,25);b=rnd(3,9);}
      else{op='÷';b=rnd(3,9);a=b*rnd(11,25);}}
    const ans=op==='+'?a+b:op==='−'?a-b:op==='×'?a*b:a/b;
    return{t:`${a} ${op} ${b}`,ans:String(ans)};}
  function next(){
    do{q=gen(c.level.id);}while(q.t===prevT);prevT=q.t;inp='';draw();info();}
  function draw(){box.querySelector('.ct-q').textContent=`${q.t} = ${inp||'?'}`;}
  function info(){
    if(c.train)c.setInfo(`Осталось: ${Math.max(0,Math.ceil((DUR-c.elapsed())/1000))} с · верно: ${right}`);
    else c.setInfo(`Пример ${Math.min(total+1,REST_N)} из ${REST_N}`);}
  function say(t,cls){const m=box.querySelector('.ct-m');m.textContent=t;m.className='ct-m '+(cls||'');clearTimeout(msgT);msgT=setTimeout(()=>{if(box){m.textContent='';m.className='ct-m';}},1200);}
  function answer(ok){
    total++;const qe=box.querySelector('.ct-q');
    if(ok){right++;if(c.effects.right)fxFlash(qe,'okf',300);say('');}
    else{wrong++;if(c.effects.error)fxFlash(qe,'badf',400);say(`Неверно: ${q.t} = ${q.ans}`,'err');lockUntil=performance.now()+500;}
    if(!c.train&&total>=REST_N){end();return;}
    next();}
  function key(k){
    if(!c||ended||performance.now()<lockUntil)return;
    if(k==='del'){inp=inp.slice(0,-1);draw();return;}
    if(k==='skip'){answer(false);return;}
    if(inp.length>=6)return;
    inp+=k;draw();
    if(inp.length>=q.ans.length)answer(inp===q.ans);}
  function down(e){const b=e.target.closest('[data-k]');if(!b||!c)return;e.preventDefault();
    if(c.effects.press)fxFlash(b,'press',120);key(b.dataset.k);}
  function onKey(e){if(/^[0-9]$/.test(e.key)){e.preventDefault();key(e.key);}else if(e.key==='Backspace'){e.preventDefault();key('del');}}
  function end(){if(ended)return;ended=true;clearInterval(tick);
    c.finish({score:right,timeMs:c.train?DUR:undefined,extra:{right,wrong,total}});}
  return{
    id:'mental',title:'Счёт в уме на время',section:'count',ownTimer:true,
    desc:'Решайте примеры в уме и набирайте ответ на кнопках — он проверяется сам. Тренировка: сколько верных ответов за 60 секунд. Отдых: 10 примеров без спешки.',
    modes:['train','rest'],
    levels:[{id:'1',name:'Лёгкий',hint:'Сложение и вычитание до 20'},{id:'2',name:'Средний',hint:'Сложение и вычитание до 100'},
            {id:'3',name:'Таблица умножения',hint:'Умножение и деление до 9×9'},{id:'4',name:'Сложный',hint:'Трёхзначные числа, умножение до 25×9'}],
    score:{unit:'верных ответов за минуту',short:'верн.',better:'high'},

/* --- Судоку (Логика). Классическое 9×9. Головоломка создаётся заново при каждом запуске,
       у неё всегда одно решение. Очки = время в секундах (меньше — лучше), ошибки — отдельно. --- */
Registry.register((()=>{
  const GIVENS={1:38,2:32,3:28,4:25};
  const RC=[...Array(81)].map((_,i)=>[Math.floor(i/9),i%9,Math.floor(i/27)*3+Math.floor(i%9/3)]);
  const bits=m=>{const r=[];for(let d=1;d<=9;d++)if(m&(1<<d))r.push(d);return r;};
  // перебор с выбором клетки с наименьшим числом вариантов; считает решения до limit
  function solve(g,limit,rand){
    const R=new Array(9).fill(0),C=new Array(9).fill(0),B=new Array(9).fill(0);let count=0,first=null;
    for(let i=0;i<81;i++)if(g[i]){const[r,c,b]=RC[i],m=1<<g[i];R[r]|=m;C[c]|=m;B[b]|=m;}
    (function rec(){
      let best=-1,bm=0,bn=10;
      for(let i=0;i<81;i++)if(!g[i]){const[r,c,b]=RC[i],m=~(R[r]|C[c]|B[b])&0x3FE;let n=0;for(let x=m;x;x&=x-1)n++;
        if(n<bn){best=i;bm=m;bn=n;if(n<=1)break;}}
      if(best<0){count++;if(!first)first=g.slice();return;}
      if(!bn)return;
      const ds=bits(bm);if(rand)for(let i=ds.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ds[i],ds[j]]=[ds[j],ds[i]];}
      const[r,c,b]=RC[best];
      for(const d of ds){const m=1<<d;g[best]=d;R[r]|=m;C[c]|=m;B[b]|=m;rec();R[r]&=~m;C[c]&=~m;B[b]&=~m;g[best]=0;if(count>=limit)return;}
    })();
    return{count,first};}
  function generate(level){
    const sol=solve(new Array(81).fill(0),1,true).first;
    const puz=sol.slice(),order=[...Array(81).keys()];
    for(let i=80;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
    let givens=81;const target=GIVENS[level]||32;
    for(const i of order){if(givens<=target)break;const v=puz[i];puz[i]=0;
      if(solve(puz.slice(),2,false).count!==1)puz[i]=v;else givens--;}
    return{puz,sol,givens};}

  let c=null,root=null,box=null,gridEl=null,cells=[],puz,sol,val,notes,sel=-1,noteMode=false,errs=0,onRes=null;
  function layout(){
    if(!box)return;const pad=box.querySelector('.sd-pad'),W=root.clientWidth-4,H=root.clientHeight-pad.offsetHeight-6;
    const side=Math.max(200,Math.floor(Math.min(W,H)));
    gridEl.style.width=gridEl.style.height=side+'px';gridEl.style.fontSize=Math.round(side/9*0.68)+'px';}
  function left(){let n=0;for(let i=0;i<81;i++)if(val[i]!==sol[i])n++;return n;}
  const limit=()=>c.train?c.options.limit:0;
  function info(){const L=limit();
    c.setInfo(`Осталось: ${left()}`+(L?` · ошибки ${errs}/${L}`:(c.train&&c.effects.errors&&errs?` · ошибок: ${errs}`:'')));}
  function draw(){
    const sv=sel>=0?val[sel]:0;
    for(let i=0;i<81;i++){
      const el=cells[i],v=val[i];
      el.classList.toggle('sel',i===sel);
      el.classList.toggle('area',!!(c.effects.area&&sel>=0&&i!==sel&&(RC[i][0]===RC[sel][0]||RC[i][1]===RC[sel][1]||RC[i][2]===RC[sel][2])));
      el.classList.toggle('same',!!(c.effects.same&&sv&&v===sv&&i!==sel));
      el.classList.toggle('wrong',!!(c.effects.errors&&v&&!puz[i]&&v!==sol[i]));
      if(v)el.textContent=v;
      else if(notes[i])el.innerHTML='<span class="nt">'+[1,2,3,4,5,6,7,8,9].map(d=>`<i>${notes[i]&(1<<d)?d:''}</i>`).join('')+'</span>';
      else el.textContent='';}
    box.querySelector('[data-k="note"]').classList.toggle('on',noteMode);
    for(let d=1;d<=9;d++)box.querySelector(`.sd-dg [data-k="${d}"]`).classList.toggle('used',!!c.options.fade&&val.filter((v,i)=>v===d&&v===sol[i]).length>=9);}
  function put(d){
    if(sel<0||puz[sel])return;
    if(c.options.lock&&val[sel]&&val[sel]===sol[sel])return;   // верная цифра закреплена
    if(d===0){val[sel]=0;notes[sel]=0;draw();info();return;}
    if(noteMode){if(!val[sel]){notes[sel]^=1<<d;draw();}return;}
    if(val[sel]===d){val[sel]=0;draw();info();return;}   // та же цифра ещё раз — стереть (как на sudoku.com)
    val[sel]=d;notes[sel]=0;
    if(d!==sol[sel])errs++;
    else for(let i=0;i<81;i++)if(RC[i][0]===RC[sel][0]||RC[i][1]===RC[sel][1]||RC[i][2]===RC[sel][2])notes[i]&=~(1<<d); // убрать заметку с этой цифрой рядом
    draw();info();
    if(limit()&&errs>=limit()){const t=c.elapsed();
      c.finish({score:null,timeMs:t,extra:{errors:errs,givens:puz.filter(Boolean).length,lost:true,lostText:`Допущено ошибок: ${errs} из ${limit()} разрешённых`}});return;}
    if(!left()){const t=c.elapsed();c.finish({score:t/1000,timeMs:t,extra:{errors:errs,givens:puz.filter(Boolean).length}});}}
  function down(e){
    if(!c)return;
    const cell=e.target.closest('.sd-c'),k=e.target.closest('[data-k]');
    if(cell){e.preventDefault();sel=+cell.dataset.i;draw();return;}
    if(k){e.preventDefault();if(c.effects.press)fxFlash(k,'press',120);
      if(k.dataset.k==='note'){noteMode=!noteMode;draw();}else put(+k.dataset.k);}}
  function onKey(e){
    if(!c)return;
    if(/^[1-9]$/.test(e.key)){e.preventDefault();put(+e.key);}
    else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0'){e.preventDefault();put(0);}
    else if(e.key.startsWith('Arrow')){e.preventDefault();if(sel<0)sel=0;else{const[r,cc]=RC[sel];
      sel=e.key==='ArrowUp'?((r+8)%9)*9+cc:e.key==='ArrowDown'?((r+1)%9)*9+cc:e.key==='ArrowLeft'?r*9+(cc+8)%9:r*9+(cc+1)%9;}draw();}
    else if(e.key==='n'||e.key==='т'){noteMode=!noteMode;draw();}}
  return{
    id:'sudoku',title:'Судоку',section:'logic',
    desc:'Заполните клетки цифрами 1–9 так, чтобы в каждой строке, столбце и квадрате 3×3 все цифры были разными. Нажмите клетку, затем цифру; та же цифра ещё раз — стереть. «Заметки» — мелкие пометки для себя.',
    modes:['train','rest'],
    levels:[{id:'1',name:'Лёгкий',hint:'38 открытых цифр'},{id:'2',name:'Средний',hint:'32 открытые цифры'},{id:'3',name:'Сложный',hint:'28 открытых цифр'},{id:'4',name:'Эксперт',hint:'около 25 открытых цифр'}],
    score:{unit:'с',better:'low'},
    options:[{id:'limit',name:'Лимит ошибок',hint:'Партия заканчивается после стольких ошибок (только в «Тренировке»)',type:'choice',
               choices:[{v:0,l:'Нет'},{v:3,l:'3'},{v:5,l:'5'},{v:10,l:'10'}],def:3},
             {id:'lock',name:'Закреплять верные цифры',hint:'Верно поставленную цифру нельзя изменить или стереть (как на sudoku.com)',type:'toggle',def:false},
             {id:'fade',name:'Бледнеть расставленным цифрам',hint:'Цифра на кнопке бледнеет, когда все 9 таких уже верно стоят на поле',type:'toggle',def:true}],
    effects:[{id:'press',name:'Подсветка нажатия',hint:'Нажатая кнопка цифры на мгновение подсвечивается'},
             {id:'area',name:'Подсветка строки, столбца и квадрата',hint:'Для выбранной клетки'},
             {id:'same',name:'Подсветка одинаковых цифр',hint:'Все такие же цифры, как в выбранной клетке'},
             {id:'errors',name:'Подсветка ошибок',hint:'Неверная цифра показывается красным (это подсказка)'}],
    summary:r=>r.extra&&!r.extra.lost?`Ошибок: <b>${r.extra.errors}</b> · открытых цифр: ${r.extra.givens}`:'',
    _generate:generate,_solve:solve,
    save:()=>puz?{puz,sol,val:val.slice(),notes:notes.slice(),errs}:null,
    start(ctx){
      c=ctx;root=ctx.root;sel=-1;noteMode=false;errs=0;
      const R=ctx.resume,ok81=a=>Array.isArray(a)&&a.length===81&&a.every(x=>Number.isInteger(x));
      if(R&&ok81(R.puz)&&ok81(R.sol)&&ok81(R.val)&&ok81(R.notes)){puz=R.puz;sol=R.sol;val=R.val;notes=R.notes;errs=R.errs|0;}
      else{const g=generate(ctx.level.id);puz=g.puz;sol=g.sol;val=puz.slice();notes=new Array(81).fill(0);}
      box=document.createElement('div');box.className='sd';
      box.innerHTML=`<div class="sd-wrap"><div class="sd-g">${puz.map((v,i)=>`<button class="sd-c${v?' giv':''} r${RC[i][0]} c${RC[i][1]}" data-i="${i}"></button>`).join('')}</div></div>
        <div class="sd-pad"><div class="sd-dg">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-k="${d}">${d}</button>`).join('')}</div>
        <div class="sd-tl"><button data-k="0">⌫ Стереть</button><button data-k="note">✎ Заметки</button></div></div>`;
      gridEl=box.querySelector('.sd-g');cells=[...box.querySelectorAll('.sd-c')];
      box.addEventListener('pointerdown',down);addEventListener('keydown',onKey);
      root.appendChild(box);layout();onRes=()=>layout();addEventListener('resize',onRes);
      draw();info();ctx.startTimer();},
    stop(){if(box)box.removeEventListener('pointerdown',down);removeEventListener('keydown',onKey);if(onRes)removeEventListener('resize',onRes);
      box=null;c=null;root=null;cells=[];onRes=null;}
  };
})());

/* --- Пятнашки (Пространственное мышление). Расставить плитки по порядку.
       Нажатие на плитку в одной строке или столбце с пустым местом сдвигает её (и соседние) к нему.
       Очки = время в секундах (меньше — лучше), ходы — отдельно. --- */
Registry.register((()=>{
  const SHUF={1:[3,60],2:[4,200],3:[5,400]};
  let c=null,root=null,board=null,n=0,t=[],tiles=[],moves=0,cell=0,onRes=null;
  // t[pos] = номер плитки (0 — пустое место)
  function shuffle(steps){
    t=[...Array(n*n).keys()].map(i=>(i+1)%(n*n));let e=n*n-1,prev=-1;
    for(let s=0;s<steps||solved();s++){
      const r=Math.floor(e/n),cc=e%n,opts=[];
      if(r>0)opts.push(e-n);if(r<n-1)opts.push(e+n);if(cc>0)opts.push(e-1);if(cc<n-1)opts.push(e+1);
      const ch=opts.filter(o=>o!==prev);const o=ch[Math.floor(Math.random()*ch.length)];
      t[e]=t[o];t[o]=0;prev=e;e=o;}}
  function solved(){for(let i=0;i<n*n-1;i++)if(t[i]!==i+1)return false;return true;}
  function place(anim){
    for(let p=0;p<n*n;p++){const v=t[p];if(!v)continue;const el=tiles[v];
      el.style.transition=anim?'transform .1s ease-out':'none';
      el.style.transform=`translate(${(p%n)*cell}px,${Math.floor(p/n)*cell}px)`;el.dataset.pos=p;}}
  function layout(){
    if(!board)return;const side=Math.floor(Math.min(root.clientWidth,root.clientHeight)-16);cell=Math.floor(side/n);
    board.style.width=board.style.height=cell*n+'px';board.style.fontSize=Math.round(cell*0.42)+'px';
    tiles.forEach(el=>{if(el){el.style.width=el.style.height=(cell-4)+'px';}});place(false);}
  function info(){c.setInfo(c.train?`Ходов: ${moves}`:'Соберите по порядку');}
  function moveFrom(p){
    const e=t.indexOf(0),er=Math.floor(e/n),ec=e%n,pr=Math.floor(p/n),pc=p%n;
    if(p===e||(er!==pr&&ec!==pc))return false;
    const step=er===pr?(pc>ec?1:-1):(pr>er?n:-n);
    for(let q=e;q!==p;q+=step){t[q]=t[q+step];t[q+step]=0;moves++;}
    place(!!c.effects.slide);info();
    if(solved()){const tm=c.elapsed();c.finish({score:tm/1000,timeMs:tm,extra:{moves,size:n}});}
    return true;}
  function down(e){
    const el=e.target.closest('.pz-t');if(!el||!c)return;e.preventDefault();
    if(c.effects.press)fxFlash(el,'press',150);
    moveFrom(+el.dataset.pos);}
  function onKey(e){
    if(!c)return;const em=t.indexOf(0),r=Math.floor(em/n),cc=em%n;let p=-1;
    // стрелка двигает плитку в сторону пустого места
    if(e.key==='ArrowUp'&&r<n-1)p=em+n;else if(e.key==='ArrowDown'&&r>0)p=em-n;
    else if(e.key==='ArrowLeft'&&cc<n-1)p=em+1;else if(e.key==='ArrowRight'&&cc>0)p=em-1;
    if(p>=0){e.preventDefault();moveFrom(p);}}
  return{
    id:'fifteen',title:'Пятнашки',section:'space',
    desc:'Расставьте плитки по порядку слева направо и сверху вниз, пустое место — в правом нижнем углу. Нажмите плитку рядом с пустым местом (или в том же ряду), чтобы сдвинуть её.',
    modes:['train','rest'],
    levels:[{id:'1',name:'Лёгкий',hint:'3×3, плитки 1–8'},{id:'2',name:'Классический',hint:'4×4, плитки 1–15'},{id:'3',name:'Сложный',hint:'5×5, плитки 1–24'}],
    score:{unit:'с',better:'low'},
    effects:[{id:'press',name:'Подсветка нажатия',hint:'Нажатая плитка на мгновение подсвечивается'},
             {id:'slide',name:'Плавный сдвиг',hint:'Плитки сдвигаются коротким движением, а не мгновенно'}],
    summary:r=>r.extra?`Ходов: <b>${r.extra.moves}</b>`:'',
    start(ctx){
      c=ctx;root=ctx.root;const[sz,steps]=SHUF[ctx.level.id]||SHUF[2];n=sz;moves=0;shuffle(steps);
      root.classList.add('center');
      board=document.createElement('div');board.className='pz';tiles=[null];
      for(let v=1;v<n*n;v++){const el=document.createElement('button');el.className='pz-t';el.dataset.n=v;el.textContent=v;board.appendChild(el);tiles.push(el);}
      board.addEventListener('pointerdown',down);addEventListener('keydown',onKey);
      root.appendChild(board);layout();onRes=()=>layout();addEventListener('resize',onRes);
      info();ctx.startTimer();},
    stop(){if(board)board.removeEventListener('pointerdown',down);removeEventListener('keydown',onKey);if(onRes)removeEventListener('resize',onRes);
      if(root)root.classList.remove('center');board=null;tiles=[];c=null;root=null;onRes=null;}
  };
})());

/* --- Дыхание по ритму (Отдых). Подсказывает фазы: вдох, задержка, выдох.
       Тренировка: 3 минуты с обратным отсчётом, очки = число полных циклов.
       Отдых: без таймера, сколько хочется — кнопка «Достаточно». Экран не гаснет во время упражнения. --- */
Registry.register((()=>{
  const PAT={1:[['Вдох',4],['Выдох',4]],2:[['Вдох',4],['Задержка',4],['Выдох',4],['Задержка',4]],3:[['Вдох',4],['Задержка',7],['Выдох',8]],4:[['Вдох',5],['Выдох',5]]};
  const DUR=180000;
  let c=null,box=null,tick=0,pat=null,cyc=0,lastPh=-1,wake=null,ended=false;
  function wakeOn(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>{if(c)wake=w;else w.release();}).catch(()=>{});}catch(e){}}
  function onVis(){if(document.visibilityState==='visible'&&c&&!wake)wakeOn();}
  function update(){
    if(!c||ended)return;
    const cycMs=pat.reduce((a,p)=>a+p[1],0)*1000,el=c.elapsed(),inC=el%cycMs;cyc=Math.floor(el/cycMs);
    if(c.train&&el>=DUR&&inC<200){end();return;}   // заканчиваем на границе цикла после 3 минут
    let acc=0,ph=0;while(inC>=acc+pat[ph][1]*1000){acc+=pat[ph][1]*1000;ph++;}
    const into=inC-acc,len=pat[ph][1]*1000,name=pat[ph][0];
    const key=cyc*10+ph;
    if(key!==lastPh){lastPh=key;if(c.effects.vibro&&navigator.vibrate)navigator.vibrate(name==='Задержка'?[30,60,30]:60);}
    box.querySelector('.br-ph').textContent=name;
    box.querySelector('.br-s').textContent=Math.ceil((len-into)/1000);
    box.querySelector('.br-bar i').style.width=Math.min(100,Math.floor(into/1000+1)/pat[ph][1]*100)+'%';
    if(c.effects.circle){
      let k;if(name==='Вдох')k=into/len;else if(name==='Выдох')k=1-into/len;else k=ph>0&&pat[ph-1][0]==='Вдох'?1:0;
      box.querySelector('.br-c').style.transform=`scale(${(0.45+0.55*k).toFixed(3)})`;}
    if(c.train){const sec=Math.ceil(Math.max(0,DUR-el)/1000);c.setInfo(`Осталось: ${Math.floor(sec/60)}:${pad2(sec%60)} · циклов: ${cyc}`);}
    else c.setInfo('Дышите спокойно');}
  function end(){if(ended)return;ended=true;clearInterval(tick);
    c.finish({score:cyc,timeMs:c.train?Math.round(c.elapsed()):undefined,extra:{cycles:cyc}});}
  return{
    id:'breath',title:'Дыхание по ритму',section:'rest',ownTimer:true,levelLabel:'Ритм',
    desc:'Дышите по подсказкам на экране: вдох, задержка, выдох. Вдох — носом, выдох — спокойно и полностью. Тренировка — 3 минуты, отдых — сколько захочется.',
    modes:['rest','train'],
    levels:[{id:'1',name:'Ровное',hint:'вдох 4 · выдох 4'},{id:'2',name:'Квадрат',hint:'вдох 4 · пауза 4 · выдох 4 · пауза 4'},
            {id:'3',name:'Успокаивающее',hint:'вдох 4 · пауза 7 · выдох 8'},{id:'4',name:'Медленное',hint:'вдох 5 · выдох 5'}],
    score:{unit:'циклов за 3 минуты',short:'цикл.',better:'high'},
    effects:[{id:'circle',name:'Дышащий круг',hint:'Круг плавно растёт на вдохе и сжимается на выдохе'},
             {id:'vibro',name:'Вибрация при смене фазы',hint:'Можно дышать с закрытыми глазами'}],
    summary:r=>r.extra?`Полных циклов: <b>${r.extra.cycles}</b>`:'',
    start(ctx){
      c=ctx;pat=PAT[ctx.level.id]||PAT[1];cyc=0;lastPh=-1;ended=false;
      box=document.createElement('div');box.className='br';
      box.innerHTML=`<div class="br-mid">${ctx.effects.circle?'<div class="br-c"></div>':''}<div class="br-t"><div class="br-ph"></div><div class="br-s"></div></div></div>
        <div class="br-bar"><i></i></div>${ctx.train?'':'<button class="big" id="brDone">Достаточно</button>'}`;
      ctx.root.appendChild(box);
      if(!ctx.train)box.querySelector('#brDone').onclick=()=>end();
      wakeOn();document.addEventListener('visibilitychange',onVis);
      ctx.startTimer();update();tick=setInterval(update,100);},
    stop(){clearInterval(tick);document.removeEventListener('visibilitychange',onVis);try{if(wake)wake.release();}catch(e){}wake=null;box=null;c=null;}
  };
})());

/* =====================================================================
   6. ИНТЕРФЕЙС: экраны и переходы (кнопка «Назад» телефона работает как стрелка в шапке)
   ===================================================================== */
const view=$('#view');
let running=null; // запущенное упражнение

let cur={s:'home'},curD=0;
const isHome=st=>!st||st.s==='home';
const depthOf=st=>st.s==='run'?3:st.s==='ex'?2:isHome(st)?0:1;
const appState=(scr,d)=>({app:APP_ID,d,scr});
// состояние записи истории → экран (понимает и записи прошлых версий)
function fromHist(h){
  if(!h)return null;
  if(h.app===APP_ID&&h.scr)return{scr:h.scr,d:h.d|0};
  if(h.guard&&h.scr)return{scr:h.scr,d:depthOf(h.scr)};
  if(h.base)return{scr:{s:'home'},d:0};
  if(h.s)return{scr:h.run?{s:'run',p:h.p}:{s:h.s,p:h.p},d:depthOf(h.run?{s:'run'}:h)};
  return null;}
async function go(st){
  await histSettled();
  if(activeTap()){curD++;history.pushState(appState(st,curD),'');}
  else history.replaceState(appState(st,curD),'');     // без касания новую запись не добавляем
  cur=st;show(st);}
function goBack(){if(modalClose){modalClose();return;}history.back();}
function goHome(){if(curD>0)history.go(-curD);else{cur={s:'home'};show(cur);}}
function refresh(){if(cur.s!=='run')show(cur);}
addEventListener('popstate',e=>{
  if(ownBack){ownBack.done();return;}
  const wasModal=!!modalClose;if(modalClose)modalClose(true);
  const f=fromHist(e.state)||{scr:{s:'home'},d:0};
  const same=JSON.stringify(f.scr)===JSON.stringify(cur);
  curD=f.d;
  if(wasModal&&same)return;                 // закрыли окно — экран под ним не трогаем (игра не перезапускается)
  if(f.scr.s==='run'&&f.d>0){cur={s:'ex',p:f.scr.p};curD=f.d-1;show(cur);selfBack();return;} // на запись игры — к выбору уровня
  cur=f.scr;show(cur);
});
$('#backBtn').onclick=goBack;

/* Автосохранение незаконченной партии (для упражнений с save()): каждые 5 с, при уходе из приложения
   и при выходе с экрана игры. Хранится, пока партию не закончат или не начнут новую. */
function autosave(){
  if(!running||!running.mod.save||running.ctx._dead||running.ctx.done)return;
  try{const st=running.mod.save();if(!st)return;
    Store.settings().saved[running.mod.id]={mode:running.ctx.mode,level:running.ctx.level.id,elapsed:Math.round(running.ctx.elapsed()),state:st,date:new Date().toISOString()};
    Store.save();}catch(e){console.error(e);}}
const savedOf=mod=>{const v=Store.settings().saved[mod.id];return v&&mod.save&&mod.levels.some(l=>l.id===v.level)&&mod.modes.includes(v.mode)?v:null;};
function dropSaved(mod){if(Store.settings().saved[mod.id]){delete Store.settings().saved[mod.id];Store.save();}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')autosave();});
addEventListener('pagehide',autosave);
function stopRunning(){
  if(!running)return;
  autosave();
  running.ctx._dead=true;clearInterval(running.tick);clearInterval(running.saveTick);
  try{running.mod.stop();}catch(e){console.error(e);}
  running=null;}

function show(st){
  stopRunning();view.classList.remove('run');
  if(st.s==='run'){const m=Registry.get(st.p);if(!m)return goHome();
    $('#backBtn').classList.remove('hidden');scrollTo(0,0);
    const sv=st.cont&&savedOf(m);
    if(sv)return runEx(m,sv.mode,m.levels.find(l=>l.id===sv.level),sv);
    return runEx(m,curMode(m),curLevel(m));}
  $('#backBtn').classList.toggle('hidden',st.s==='home');
  scrollTo(0,0);
  if(st.s==='section')return renderSection(st.p);
  if(st.s==='ex')return renderExIntro(st.p);
  if(st.s==='stats')return renderStats();
  return renderHome();}

function renderHome(){
  view.innerHTML=`
    <button class="big off" id="warmBtn">Разминка на 5 минут</button>
    ${SECTIONS.map(s=>{const all=Registry.bySection(s.id),n=all.filter(m=>!m.test).length,t=all.length-n,sm=Stats.sectionSummary(s.id);
      return `<button class="sec" data-sec="${s.id}"><span class="dot" style="background:${s.color}"></span>
        <span><div class="nm">${esc(s.name)}</div><div class="ds">${n?`Упражнений: ${n}`:t?'Тестовое упражнение':'Упражнения скоро'}${sm.count?` · занятий: ${sm.count}`:''}</div></span>
        <svg class="i go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>`;}).join('')}
    <button class="big alt" id="statsBtn">Статистика</button>`;
  $('#warmBtn').onclick=()=>toast('«Разминка на 5 минут» появится на этапе 2');
  $('#statsBtn').onclick=()=>go({s:'stats'});
  view.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>go({s:'section',p:b.dataset.sec}));}

function renderSection(id){
  const s=secById(id);if(!s)return renderHome();
  const mods=Registry.bySection(id);
  const done=new Set(mods.map(m=>m.title));
  view.innerHTML=`<h2>${esc(s.name)}</h2>
    ${mods.map(m=>{const c=Stats.all().filter(r=>r.ex===m.id).length;
      return `<button class="exl" data-ex="${m.id}"><div class="nm">${esc(m.title)}</div><div class="small muted">${esc(m.desc)}</div>${c?`<div class="small muted">Занятий: ${c}</div>`:''}</button>`;}).join('')}
    ${s.planned.filter(t=>!done.has(t)).length?`<div class="lbl">Будут добавлены</div>`+s.planned.filter(t=>!done.has(t)).map(t=>`<div class="soon"><span>${esc(t)}</span><span class="small">скоро</span></div>`).join(''):''}`;
  view.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>go({s:'ex',p:b.dataset.ex}));}

function curMode(mod){const m=Store.settings().mode;return mod.modes.includes(m)?m:mod.modes[0];}
function fxState(mod){const st=Store.settings().effects[mod.id]||{},o={};(mod.effects||[]).forEach(f=>o[f.id]=st[f.id]===true);return o;}
function optState(mod){const st=Store.settings().options[mod.id]||{},o={};
  (mod.options||[]).forEach(f=>{const v=st[f.id];o[f.id]=f.type==='choice'?(f.choices.some(c=>c.v===v)?v:f.def):(typeof v==='boolean'?v:!!f.def);});return o;}
function optSet(mod,id,v){const e=Store.settings().options;if(!e[mod.id]||typeof e[mod.id]!=='object')e[mod.id]={};e[mod.id][id]=v;Store.save();}
function fxSet(mod,id,v){const e=Store.settings().effects;if(!e[mod.id]||typeof e[mod.id]!=='object')e[mod.id]={};e[mod.id][id]=v;Store.save();}
function curLevel(mod){const id=Store.settings().levels[mod.id];return mod.levels.find(l=>l.id===id)||mod.levels[0];}

function renderExIntro(id){
  const mod=Registry.get(id);if(!mod)return renderHome();
  const mode=curMode(mod),level=curLevel(mod);
  const b=Stats.best(mod.id,level.id),sv=savedOf(mod);
  view.innerHTML=`<h2>${esc(mod.title)}</h2>
    ${sv?`<div class="card small" id="savedCard" style="border-color:var(--accent);background:#eaf2ff"><b>Незаконченная партия</b><br>${esc(MODES[sv.mode])} · ${esc((mod.levels.find(l=>l.id===sv.level)||{}).name||'')} · ${sv.mode==='train'?'время '+fmtTimer(sv.elapsed).slice(0,5)+' · ':''}${fmtDate(sv.date)}</div>`:''}
    <div class="card small">${esc(mod.desc)}</div>
    <div class="lbl">Режим</div>
    <div class="seg">${mod.modes.map(m=>`<button data-mode="${m}" class="${m===mode?'on':''}">${MODES[m]}</button>`).join('')}</div>
    <div class="small muted" style="margin:-4px 4px 12px">${mode==='train'?'Время и очки идут в статистику.':'Без таймера и очков — учитывается только факт занятия.'}</div>
    <div class="lbl">${esc(mod.levelLabel||'Уровень сложности')}</div>
    <div class="lvls">${mod.levels.map(l=>`<button class="lvl ${l.id===level.id?'on':''}" data-lvl="${esc(l.id)}"><b>${esc(l.name)}</b>${l.hint?`<span>${esc(l.hint)}</span>`:''}</button>`).join('')}</div>
    ${mod.options&&mod.options.length?`<div class="lbl">Настройки игры</div>
    ${mod.options.map(f=>{const v=optState(mod)[f.id];
      if(f.type==='choice')return `<div class="card opt"><div>${esc(f.name)}${f.hint?`<small>${esc(f.hint)}</small>`:''}</div><div class="seg" style="margin:8px 0 0">${f.choices.map(ch=>`<button data-opt="${esc(f.id)}" data-v="${esc(JSON.stringify(ch.v))}" class="${ch.v===v?'on':''}">${esc(ch.l)}</button>`).join('')}</div></div>`;
      return `<button class="tgl ${v?'on':''}" data-opt="${esc(f.id)}" aria-pressed="${v}"><span>${esc(f.name)}${f.hint?`<small>${esc(f.hint)}</small>`:''}</span><span class="sw"></span></button>`;}).join('')}`:''}
    ${mod.effects&&mod.effects.length?`<div class="lbl">Эффекты</div>
    ${mod.effects.map(f=>{const on=fxState(mod)[f.id];return `<button class="tgl ${on?'on':''}" data-fx="${esc(f.id)}" aria-pressed="${on}"><span>${esc(f.name)}${f.hint?`<small>${esc(f.hint)}</small>`:''}</span><span class="sw"></span></button>`;}).join('')}`:''}
    ${mode==='train'?`<div class="small muted" style="margin:0 4px 12px">Лучший результат на этом уровне: ${b?`<b>${fmtNum(b.score)}</b> ${esc(mod.score.unit)}`:'ещё нет'}</div>`:''}
    <div class="startbar">${sv?`<button class="big" id="contBtn">Продолжить</button><button class="big alt" id="startBtn" style="margin-top:8px;min-height:50px">Начать новую</button>`:`<button class="big" id="startBtn">Начать</button>`}</div>`;
  view.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{Store.settings().mode=x.dataset.mode;Store.save();renderExIntro(id);});
  view.querySelectorAll('[data-opt]').forEach(x=>x.onclick=()=>{const f=mod.options.find(o=>o.id===x.dataset.opt);
    optSet(mod,f.id,f.type==='choice'?JSON.parse(x.dataset.v):!optState(mod)[f.id]);renderExIntro(id);});
  view.querySelectorAll('[data-fx]').forEach(x=>x.onclick=()=>{fxSet(mod,x.dataset.fx,!fxState(mod)[x.dataset.fx]);renderExIntro(id);});

  $('#startBtn').onclick=async()=>{

const fmtNum=n=>n==null?'—':(Math.round(n*10)/10).toString().replace('.',',');

function runEx(mod,mode,level,resume){
  stopRunning();view.classList.add('run');
  $('#backBtn').classList.remove('hidden');
  const train=mode==='train';
  view.innerHTML=`
    <div class="strip"><span id="exInfo"></span>${train?(mod.ownTimer?'':'<span class="tm" id="exTime">00:00.0</span>'):`<span class="tag rest">Отдых</span>`}</div>
    <div class="exroot" id="exRoot"></div>
    <button class="big alt" id="exStop">Завершить</button>`;
  let t0=null,tStop=null;
  const ctx={root:$('#exRoot'),mode,level,train,effects:fxState(mod),options:optState(mod),_dead:false,resume:resume?resume.state:null,
    setInfo:t=>{if(!ctx._dead)$('#exInfo').textContent=t;},
    startTimer:()=>{t0=performance.now()-(resume&&resume.elapsed||0);tStop=null;},
    elapsed:()=>t0==null?0:((tStop??performance.now())-t0),
    finish:r=>{
      if(ctx._dead)return;tStop=performance.now();ctx.done=true;dropSaved(mod);
      const res=Object.assign({},r);if(res.timeMs==null&&t0!=null)res.timeMs=ctx.elapsed();
      stopRunning();guardClicks();
      const rec=Stats.make(mod,mode,level,res);
      const saved=Stats.add(rec);
      showResult(mod,mode,level,rec,saved);}};
  running={mod,ctx,tick:train?setInterval(()=>{const e=$('#exTime');if(e&&t0!=null)e.textContent=fmtTimer(ctx.elapsed());},100):0,
    saveTick:mod.save?setInterval(autosave,5000):0};
  $('#exStop').onclick=async()=>{
    if(mod.save&&running&&running.ctx===ctx){
      const k=await choose('Завершить партию?','Незаконченную партию можно сохранить и продолжить позже.',
        [{k:'save',l:'Сохранить и выйти',cls:'pri'},{k:'drop',l:'Удалить и выйти',cls:'dng'},{k:null,l:'Продолжить игру',cls:'cnl'}]);
      if(!k||!running||running.ctx!==ctx)return;
      stopRunning();if(k==='drop')dropSaved(mod);
      await histSettled();goBack();return;}
    stopRunning();goBack();};
  try{mod.start(ctx);}catch(e){console.error(e);stopRunning();toast('Ошибка запуска упражнения');}
  if(resume&&running)toast('Партия продолжена');}

function showResult(mod,mode,level,rec,saved){
  view.classList.remove('run');
  const train=mode==='train';
  let body;
  if(rec.extra&&rec.extra.lost){
    body=`<div class="sc" style="color:var(--danger)">Не решено</div><div class="un">${esc(rec.extra.lostText||'Партия остановлена')}</div>
      <div class="small muted" style="margin-top:8px">Занятие засчитано, в лучшие результаты не идёт</div>`;
    if(mod.summary){const x=mod.summary(rec);if(x)body+=`<div class="small" style="margin-top:10px">${x}</div>`;}
  }else if(train){
    const prev=Stats.best(mod.id,level.id,rec.id);
    const isRec=rec.score!=null&&(!prev||(mod.score.better==='low'?rec.score<prev.score:rec.score>prev.score));
    body=`<div class="sc">${fmtNum(rec.score)}</div><div class="un">${esc(mod.score.unit)}</div>
      <div style="margin-top:10px">${mod.score.unit==='с'?'':`Длительность: <b>${fmtTime(rec.timeMs)}</b> · `}уровень: ${esc(level.name)}</div>
      ${isRec?`<div class="rec">${prev?'Новый личный рекорд!':'Первый результат на этом уровне'}</div>`:`<div class="muted small" style="margin-top:8px">Лучший: ${fmtNum(prev.score)}</div>`}`;
    if(mod.summary){const x=mod.summary(rec);if(x)body+=`<div class="small" style="margin-top:10px">${x}</div>`;}
  }else body=`<div class="sc" style="color:var(--ok)">Готово</div><div class="un">Режим «Отдых»: занятие засчитано, без очков и времени</div>`;
  view.innerHTML=`<h2>${esc(mod.title)}</h2><div class="card res">${body}${saved?'':'<div class="muted small" style="margin-top:8px">Результат не сохранён</div>'}</div>
    <button class="big" id="againBtn">Ещё раз</button>
    <button class="big alt" id="lvlBtn">Сменить уровень или режим</button>
    <button class="big alt" id="homeBtn">К разделам</button>`;
  $('#againBtn').onclick=()=>runEx(mod,mode,level);
  $('#lvlBtn').onclick=goBack;
  $('#homeBtn').onclick=goHome;}
// Защита от «хвостового» клика: упражнение завершается по касанию (pointerdown), экран меняется,
// а клик того же касания мог бы нажать кнопку на новом экране. Клики сразу после смены экрана игнорируются.
let clickGuardUntil=0;
const guardClicks=(ms=450)=>{clickGuardUntil=performance.now()+ms;};
document.addEventListener('click',e=>{if(performance.now()<clickGuardUntil){e.stopPropagation();e.preventDefault();}},true);

        <td style="text-align:right">${sm.count?`<b>${sm.count}</b><div class="muted small" style="white-space:nowrap">трен. ${sm.train} · отдых ${sm.rest}</div><div class="muted small" style="white-space:nowrap">${fmtDate(sm.last)}</div>`:'<span class="muted">—</span>'}</td></tr>`;}).join('')}</table></div>
    <div class="lbl">Последние занятия</div>
    ${rs.length?`<div class="card"><table class="st">${rs.map(r=>{const m=Registry.get(r.ex),lv=m&&m.levels.find(l=>l.id===r.level);

        <td style="text-align:right">${r.mode==='rest'?'<span class="tag rest">Отдых</span>':`<b>${fmtNum(r.score)}</b> <span class="small">${esc(m?(m.score.short||m.score.unit):'')}</span><div class="muted small">${fmtTime(r.timeMs)}</div>`}</td></tr>`;}).join('')}</table></div>`
      :'<div class="card muted">Пока нет занятий.</div>'}
    <div class="small muted" style="margin:8px 4px">Динамика и лучшие результаты по навыкам появятся на этапе 2.</div>`;}

/* =====================================================================
   7. ЭКСПОРТ И ИМПОРТ статистики (файл .json)
   ===================================================================== */
function exportStats(){
  const d=Store.data;
  const file={app:APP_ID,kind:'stats',schema:Store.SCHEMA,appVersion:APP_VERSION,exported:new Date().toISOString(),
    results:d.results,settings:d.settings};
  const blob=new Blob([JSON.stringify(file,null,1)],{type:'application/json'});
  const a=document.createElement('a');const t=new Date();
  a.href=URL.createObjectURL(blob);a.download=`razminka-statistika-${t.getFullYear()}-${pad2(t.getMonth()+1)}-${pad2(t.getDate())}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  d.meta.lastExport=t.toISOString();Store.save();
  toast(`Сохранено занятий: ${d.results.length}. Файл в «Загрузках»`,4000);}

// разбор файла: возвращает {results, settings, skipped} или {error}
function parseImport(text){
  let f;try{f=JSON.parse(text);}catch(e){return{error:'Это не файл статистики (не читается как JSON).'};}
  if(!f||f.app!==APP_ID||f.kind!=='stats')return{error:'Это не файл статистики «Разминки для головы».'};
  const sch=+f.schema;
  if(!Number.isInteger(sch)||sch<1)return{error:'В файле не указана версия формата.'};
  if(sch>Store.SCHEMA)return{error:`Файл сохранён более новой версией приложения (формат ${sch}). Сначала обновите приложение.`};
  if(!Array.isArray(f.results))return{error:'В файле нет списка занятий.'};
  let d={schema:sch,results:f.results,settings:f.settings||{}};
  try{d=Store.migrate(d);}catch(e){return{error:'Не удалось перевести файл в текущий формат.'};}
  const ok=d.results.filter(r=>Stats.valid(r)&&r.ex!=='stub');
  return{results:ok,settings:d.settings,skipped:d.results.length-ok.length};}

async function importStats(text){
  if(Store.readOnly){toast('Запись отключена: обновите приложение',4000);return;}
  const p=parseImport(text);
  if(p.error){await choose('Импорт невозможен',esc(p.error),[{k:1,l:'Понятно',cls:'pri'}]);return;}
  const cur=Store.data.results,have=new Set(cur.map(r=>r.id));
  const newOnes=p.results.filter(r=>!have.has(r.id)).length;
  const k=await choose('Загрузить статистику',
    `В файле занятий: <b>${p.results.length}</b>${p.skipped?` (пропущено повреждённых: ${p.skipped})`:''}.<br>Сейчас в приложении: <b>${cur.length}</b>. Новых из файла: <b>${newOnes}</b>.`,
    [{k:'merge',l:'Объединить (добавить новые)',cls:'pri'},{k:'replace',l:'Заменить всё содержимым файла',cls:'dng'},{k:null,l:'Отмена',cls:'cnl'}]);
  if(!k)return;
  if(k==='replace'&&!await confirmAsk('Заменить статистику?',`Текущие ${cur.length} занятий будут удалены и заменены данными из файла.`,'Заменить','pri dng'))return;
  const d=Store.data;
  d.results=k==='replace'?p.results.slice():cur.concat(p.results.filter(r=>!have.has(r.id)));
  d.meta.lastImport=new Date().toISOString();
  if(Store.save()){toast(k==='replace'?`Загружено занятий: ${d.results.length}`:`Добавлено занятий: ${newOnes}`,3500);refresh();}}

$('#fileIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{await importStats(await f.text());}catch(err){toast('Не удалось прочитать файл');}};

$('#menuBtn').onclick=async()=>{
  const m=Store.data.meta;
  const k=await choose('Меню',
    `Версия ${APP_VERSION} от ${APP_DATE}<br>Занятий в статистике: ${Store.data.results.length}<br>Последнее сохранение в файл: ${m.lastExport?fmtDate(m.lastExport):'—'}`,
    [{k:'st',l:'Статистика'},{k:'ex',l:'Сохранить статистику в файл'},{k:'im',l:'Загрузить статистику из файла'},{k:'clr',l:'Очистить статистику',cls:'dng'},{k:'up',l:'Проверить обновления'},{k:null,l:'Закрыть',cls:'cnl'}]);
  if(k==='st'){if(cur.s!=='stats')go({s:'stats'});}
  else if(k==='ex')exportStats();
  else if(k==='im')$('#fileIn').click();
  else if(k==='clr'){if(Store.readOnly){toast('Запись отключена: обновите приложение');return;}
    if(await confirmAsk('Очистить статистику?','Все занятия будут удалены. Перед этим лучше сохранить статистику в файл.','Удалить всё','pri dng')){
      Store.data.results=[];Store.save();toast('Статистика очищена');refresh();}}
  else if(k==='up')checkUpdate();
};

let swReg=null;
function showUpd(){$('#updBar').classList.remove('hidden');}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  const hadCtrl=!!navigator.serviceWorker.controller;let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl||reloading)return;reloading=true;location.reload();});
  navigator.serviceWorker.register('sw.js').then(reg=>{swReg=reg;
    if(reg.waiting&&navigator.serviceWorker.controller)showUpd();
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;
      w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpd();});});
  }).catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&swReg)swReg.update().catch(()=>{});});
}
async function checkUpdate(){
  if(!swReg){toast('Обновления доступны только в установленной версии');return;}
  if(swReg.waiting){showUpd();return;}
  toast('Проверка…');try{await swReg.update();}catch(e){toast('Нет связи с сервером');return;}
  setTimeout(()=>{if(swReg.waiting||swReg.installing)showUpd();else toast(`Установлена последняя версия (${APP_VERSION})`);},1500);}
$('#updBtn').onclick=()=>{stopRunning();const w=swReg&&swReg.waiting;if(w)w.postMessage('SKIP_WAITING');else location.reload();};

/* =====================================================================
   ЗАПУСК
   ===================================================================== */
Store.load();
// результаты тестовой заглушки этапа 0 больше не нужны
if(!Store.readOnly&&Store.data.results.some(r=>r.ex==='stub')){Store.data.results=Store.data.results.filter(r=>r.ex!=='stub');Store.save();}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
{const f=fromHist(history.state);
  if(!f){history.replaceState(appState({s:'home'},0),'');cur={s:'home'};curD=0;show(cur);}
  else if(f.scr.s==='run'&&f.d>0){cur={s:'ex',p:f.scr.p};curD=f.d-1;show(cur);selfBack();}   // перезагрузка во время игры → к выбору уровня
  else{cur=f.scr;curD=f.d;history.replaceState(appState(cur,curD),'');show(cur);}}
</script>
